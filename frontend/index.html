<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Nimbus Console</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css"></head><body class="auth-page"><section class="auth-visual"><div class="sidebar-brand"><svg class="brand-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="16" r="15" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="11" r="2.4" fill="currentColor"/><circle cx="22" cy="10" r="2.4" fill="#34D399"/><circle cx="20" cy="21" r="2.4" fill="currentColor"/><circle cx="9" cy="20" r="2.4" fill="#34D399"/><path d="M10 11L22 10 20 21 9 20Z M10 11L20 21 M22 10L9 20" stroke="currentColor" stroke-opacity=".45"/></svg><span class="brand-name">Nimbus Console</span></div><h1>Your private cloud, under one secure console.</h1><p>Securely manage compute, storage and databases through your existing Tailscale-connected infrastructure.</p></section><section class="auth-card-wrap"><div class="auth-card"><h2>Welcome back</h2><p style="color:var(--muted)">Sign in to your cloud management console.</p><form id="loginForm"><div class="form-group"><label>Email or username</label><input class="input" id="loginUser" required placeholder="you@example.com"></div><div class="form-group"><label>Password</label><div class="password-wrap"><input class="input" id="loginPassword" type="password" required placeholder="••••••••"><button type="button" class="toggle-pass"><i class="fa-solid fa-eye"></i></button></div></div><div class="auth-row"><label><input type="checkbox"> Remember me</label><a href="#">Forgot password?</a></div><button class="btn btn-primary" style="width:100%;margin-top:22px" type="submit">Sign in</button></form><p style="text-align:center;color:var(--muted)">Don't have an account? <a href="signup.html">Create one</a></p></div></section><script src="js/api.js"></script><script src="js/auth.js"></script></body></html>
