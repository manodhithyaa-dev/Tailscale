<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up — Nimbus Console</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css"></head><body class="auth-page"><section class="auth-visual"><div class="sidebar-brand"><svg class="brand-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="16" r="15" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="11" r="2.4" fill="currentColor"/><circle cx="22" cy="10" r="2.4" fill="#34D399"/><circle cx="20" cy="21" r="2.4" fill="currentColor"/><circle cx="9" cy="20" r="2.4" fill="#34D399"/><path d="M10 11L22 10 20 21 9 20Z M10 11L20 21 M22 10L9 20" stroke="currentColor" stroke-opacity=".45"/></svg><span class="brand-name">Nimbus Console</span></div><h1>Build your private cloud workspace.</h1><p>Create an account and select the appropriate IAM role for your level of access.</p></section><section class="auth-card-wrap"><div class="auth-card"><h2>Create account</h2><form id="signupForm"><div class="form-row"><div class="form-group"><label>Full name</label><input class="input" id="signupName" required></div><div class="form-group"><label>Username</label><input class="input" id="signupUsername" required></div></div><div class="form-group"><label>Email</label><input class="input" type="email" id="signupEmail" required></div><div class="form-row"><div class="form-group"><label>Password</label><input class="input" type="password" id="signupPassword" required minlength="4" maxlength="128"><div class="strength"><span id="strengthBar"></span></div></div><div class="form-group"><label>Confirm password</label><input class="input" type="password" id="signupConfirm" required minlength="4" maxlength="128"></div></div><div class="form-group"><label>Select IAM role</label><div class="role-options"><label class="role-option selected"><input type="radio" name="role" value="Developer" checked><strong>Developer</strong><br><small>Create and manage assigned resources.</small></label><label class="role-option"><input type="radio" name="role" value="Viewer"><strong>Viewer</strong><br><small>Read-only access to infrastructure.</small></label></div></div><label style="font-size:13px"><input type="checkbox" required> I agree to the Terms and Conditions</label><button class="btn btn-primary" style="width:100%;margin-top:20px">Create account</button></form><p style="text-align:center;color:var(--muted)">Already have an account? <a href="login.html">Sign in</a></p></div></section><script src="js/api.js"></script><script src="js/auth.js"></script></body></html>
